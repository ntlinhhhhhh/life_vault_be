spring.config.import=optional:file:../.env[.properties],optional:file:.env[.properties]
spring.application.name=${API_GATEWAY_APPLICATION_NAME:api-gateway}
server.port=9000

gateway.routes.auth-service-url=${AUTH_SERVICE_URL:http://localhost:5001}
gateway.routes.vault-service-url=${VAULT_SERVICE_URL:http://localhost:5002}

gateway.jwt.secret=${AUTH_JWT_SECRET:84656880a6cf588bc33d33fc69a0096a04ab7ef1a2678ff8f1b76e440e6a055f}

gateway.redis.blacklist-enabled=${GATEWAY_REDIS_BLACKLIST_ENABLED:true}
gateway.redis.failure-backoff-seconds=${GATEWAY_REDIS_FAILURE_BACKOFF_SECONDS:30}
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.timeout=${REDIS_TIMEOUT:100ms}
spring.data.redis.connect-timeout=${REDIS_CONNECT_TIMEOUT:100ms}
spring.data.redis.repositories.enabled=false

gateway.cors.allowed-origins=${GATEWAY_CORS_ALLOWED_ORIGINS:*}
gateway.cors.allowed-methods=${GATEWAY_CORS_ALLOWED_METHODS:GET,POST,PUT,PATCH,DELETE,OPTIONS}
gateway.cors.allowed-headers=${GATEWAY_CORS_ALLOWED_HEADERS:*}
gateway.cors.exposed-headers=${GATEWAY_CORS_EXPOSED_HEADERS:Authorization}

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.health.redis.enabled=${GATEWAY_REDIS_HEALTH_ENABLED:false}
