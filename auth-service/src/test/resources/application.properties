spring.datasource.url=jdbc:h2:mem:auth_service_test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.sql.init.mode=never
auth.jwt.secret=test-secret-that-is-long-enough-for-hmac-sha-signing-in-tests
auth.jwt.access-token-ttl-seconds=900
auth.jwt.reauth-token-ttl-seconds=300
auth.refresh-token-ttl-seconds=2592000
auth.max-failed-login-count=5
auth.lock-duration-minutes=15
