spring.application.name=${AUTH_SERVICE_APPLICATION_NAME:auth-service}
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/life_vault_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}
spring.jpa.open-in-view=${JPA_OPEN_IN_VIEW:false}
spring.sql.init.mode=${SQL_INIT_MODE:never}

auth.jwt.secret=${AUTH_JWT_SECRET:change-this-secret-to-at-least-64-characters-for-local-development}
auth.jwt.access-token-ttl-seconds=${AUTH_ACCESS_TOKEN_TTL_SECONDS:900}
auth.jwt.reauth-token-ttl-seconds=${AUTH_REAUTH_TOKEN_TTL_SECONDS:300}
auth.refresh-token-ttl-seconds=${AUTH_REFRESH_TOKEN_TTL_SECONDS:2592000}
auth.max-failed-login-count=${AUTH_MAX_FAILED_LOGIN_COUNT:5}
auth.lock-duration-minutes=${AUTH_LOCK_DURATION_MINUTES:15}

springdoc.swagger-ui.path=/swagger-ui.html
